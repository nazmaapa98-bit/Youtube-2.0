name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          elif [ ! -f "app/release.keystore" ]; then
            echo "Generating fallback release keystore..."
            keytool -genkeypair -v -keystore "app/release.keystore" \
              -alias "ytplayer" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ytplayer123" -keypass "ytplayer123" \
              -dname "CN=YTPlayer, OU=YTPlayer, O=YTPlayer, L=City, S=State, C=US"
          else
            echo "Using existing app/release.keystore..."
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ytplayer123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ytplayer' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ytplayer123' }}
        run: gradle assembleRelease --stacktrace

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '\d+')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building v$VERSION_NAME (code: $VERSION_CODE)"

      - name: Rename APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" app/build/outputs/apk/release/YTPlayer-v${{ steps.version.outputs.version_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "YT Player v${{ steps.version.outputs.version_name }}"
          body: |
            ## YT Player v${{ steps.version.outputs.version_name }}

            **Version Code:** ${{ steps.version.outputs.version_code }}
            **Built:** ${{ github.event.head_commit.timestamp }}

            ### Changes
            ${{ github.event.head_commit.message }}

            ---
            📱 Download the APK below and install on your device.
            🔄 Or just open the app — it will prompt you to update!
          files: app/build/outputs/apk/release/YTPlayer-v${{ steps.version.outputs.version_name }}.apk
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
